services:
  - type: web
    name: tomato-insight-api
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 120 validation_api:app
    envVars:
      - key: ULTRALYTICS_LEAF_VALIDATION_URL
        value: https://predict-6ae37ce0bbd46ce898ad6e66-dproatj77a-df.a.run.app/predict
      - key: ULTRALYTICS_VALIDATION_API_KEY
        sync: false
      - key: ULTRALYTICS_PREDICT_URL
        sync: false
      - key: ULTRALYTICS_API_KEY
        sync: false
      - key: ULTRALYTICS_SEVERITY_URL
        value: https://predict-6af4e3d49f69f7e908215757-dproatj77a-de.a.run.app/predict
      - key: ULTRALYTICS_SEVERITY_API_KEY
        sync: false
      - key: ULTRALYTICS_SEVERITY_CONF
        value: "0.25"
      - key: ULTRALYTICS_SEVERITY_IOU
        value: "0.5"
      - key: ULTRALYTICS_SEVERITY_IMGSZ
        value: "640"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
