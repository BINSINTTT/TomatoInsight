<!DOCTYPE html>
<html lang="en" class="auth-html" data-auth="guest">
  <head>
    <meta charset="UTF-8" />
    <script src="../js/Authentication/auth-session.js"></script>
    <script src="../js/Firebase/firebase-config.js"></script>
    <script type="module" src="../js/Authentication/auth-guard.module.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato Insight — Choose new password</title>
    <link rel="icon" href="../img/LogoTomatoInsight.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body class="auth-body">
    <div class="auth-page">
      <a class="auth-back" href="login.html">← Back to log in</a>

      <div class="auth-card">
        <div class="auth-brand">
          <div class="auth-brand__mark" aria-hidden="true">TI</div>
          <h1 class="auth-brand__title">Choose a new password</h1>
          <p class="auth-brand__subtitle" id="reset-password-subtitle">
            Enter a new password for your account. It must meet the same requirements as when you signed up.
          </p>
        </div>

        <form class="auth-form" id="reset-password-form" novalidate>
          <p class="auth-form__error" id="reset-password-form-error" role="alert" hidden></p>

          <div class="auth-field">
            <label class="auth-field__label" for="reset-password-new">New password</label>
            <div class="auth-field__input-wrap">
              <input
                class="auth-field__input"
                type="password"
                id="reset-password-new"
                name="password"
                autocomplete="new-password"
                required
                aria-describedby="reset-password-rules"
              />
              <button
                type="button"
                class="auth-password-toggle"
                aria-label="Show password"
                aria-pressed="false"
                data-password-toggle
              >
                <span class="auth-password-toggle__icon auth-password-toggle__icon--show" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </span>
                <span class="auth-password-toggle__icon auth-password-toggle__icon--hide" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                    <line x1="2" x2="22" y1="2" y2="22" />
                  </svg>
                </span>
              </button>
            </div>
            <ul class="auth-password-rules" id="reset-password-rules" aria-live="polite" hidden>
              <li class="auth-password-rules__title">Password must include</li>
              <li data-rule="length">8+ characters</li>
              <li data-rule="lower">Lowercase (a–z)</li>
              <li data-rule="upper">Uppercase (A–Z)</li>
              <li data-rule="special">Special (!@#$…)</li>
            </ul>
          </div>

          <div class="auth-field">
            <label class="auth-field__label" for="reset-password-confirm">Confirm password</label>
            <div class="auth-field__input-wrap">
              <input
                class="auth-field__input"
                type="password"
                id="reset-password-confirm"
                name="confirmPassword"
                autocomplete="new-password"
                required
              />
              <button
                type="button"
                class="auth-password-toggle"
                aria-label="Show password"
                aria-pressed="false"
                data-password-toggle
              >
                <span class="auth-password-toggle__icon auth-password-toggle__icon--show" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </span>
                <span class="auth-password-toggle__icon auth-password-toggle__icon--hide" aria-hidden="true">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                    <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                    <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                    <line x1="2" x2="22" y1="2" y2="22" />
                  </svg>
                </span>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-btn" id="reset-password-submit">Update password</button>
        </form>

        <p class="auth-footer">
          Need a new link?
          <a href="login.html?forgot=1">Request reset email</a>
        </p>
      </div>
    </div>

    <script src="../js/Authentication/auth-password.js"></script>
    <script type="module" src="../js/Firebase/firebase-auth.module.js"></script>
    <script src="../js/Authentication/auth-forms.js"></script>
  </body>
</html>
