<!DOCTYPE html>
<html lang="en" class="auth-html" data-auth="guest">
  <head>
    <meta charset="UTF-8" />
    <script src="../js/Authentication/auth-session.js"></script>
    <script src="../js/Firebase/firebase-config.js"></script>
    <script type="module" src="../js/Authentication/auth-guard.module.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tomato Insight — Reset password</title>
    <link rel="icon" href="../img/LogoTomatoInsight.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body class="auth-body">
    <div class="auth-page">
      <a class="auth-back" href="login.html">← Back to log in</a>

      <div class="auth-card">
        <div class="auth-brand">
          <div class="auth-brand__mark" aria-hidden="true">TI</div>
          <h1 class="auth-brand__title">Forgot password?</h1>
          <p class="auth-brand__subtitle">
            Enter your account email and we’ll send a link to choose a new password.
          </p>
        </div>

        <form class="auth-form" id="forgot-password-form" novalidate>
          <p class="auth-form__error" id="forgot-password-form-error" role="alert" hidden></p>
          <p class="auth-form__success" id="forgot-password-form-success" role="status" hidden></p>

          <div class="auth-field">
            <label class="auth-field__label" for="forgot-password-email">Email</label>
            <input
              class="auth-field__input"
              type="email"
              id="forgot-password-email"
              name="email"
              autocomplete="email"
              inputmode="email"
              placeholder="you@gmail.com"
              required
            />
          </div>

          <button type="submit" class="auth-btn">Send reset email</button>
        </form>

        <p class="auth-footer">
          Remember your password?
          <a href="login.html">Log in</a>
        </p>
      </div>
    </div>

    <script type="module" src="../js/Firebase/firebase-auth.module.js"></script>
    <script src="../js/Authentication/auth-forms.js"></script>
  </body>
</html>
