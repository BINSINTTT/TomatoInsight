name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag (e.g. v1.0.0). Leave empty to build without publishing."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            {
              echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/release.keystore"
              echo "KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using custom release keystore from secrets"
          else
            KEYSTORE="$GITHUB_WORKSPACE/ci-debug.keystore"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=TomatoInsight CI,O=TomatoInsight,C=PH"
            {
              echo "KEYSTORE_FILE=$KEYSTORE"
              echo "KEYSTORE_PASSWORD=android"
              echo "KEY_ALIAS=androiddebugkey"
              echo "KEY_PASSWORD=android"
            } >> "$GITHUB_ENV"
            echo "Generated CI keystore for GitHub Releases sideloading"
          fi

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK for release
        run: |
          mkdir -p dist
          SRC="$(ls app/build/outputs/apk/release/*.apk | head -n 1)"
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            TAG="${{ inputs.version }}"
          fi
          OUT="dist/TomatoInsight-${TAG}.apk"
          cp "$SRC" "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          ls -lh dist/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomatoInsight-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
          name: TomatoInsight ${{ github.ref_name }}
          body: |
            ## TomatoInsight Android

            Download **TomatoInsight-${{ github.ref_name }}.apk** and install it on your Android device.

            ### Install steps
            1. On your phone, open the APK from this release.
            2. Allow install from unknown sources / browser if prompted.
            3. Open TomatoInsight and sign in.

            Requires Android 7.0+ (API 24).
